name: Maven Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required so we can manipulate and push tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -Dgit.branch=${{ github.ref_name }}

      - name: Build Docker Image
        run: |
          # Dynamically get repository name (e.g., psso-idp-proxy-server-java)
          REPO_NAME="${{ github.event.repository.name }}"
          # Sanitize branch/tag name for Docker tag (e.g., replace '/' with '-')
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
          IMAGE_NAME="${REPO_NAME}:${BRANCH_TAG}"
          ARCHIVE_NAME="${REPO_NAME}-${BRANCH_TAG}.tar.gz"

          echo "Building Docker image: $IMAGE_NAME"
          docker build -t "$IMAGE_NAME" .

          echo "Exporting Docker image to archive: $ARCHIVE_NAME"
          docker save "$IMAGE_NAME" | gzip > "$ARCHIVE_NAME"

          echo "DOCKER_IMAGE_ARCHIVE=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Determine Release Configuration and Move Tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" == "branch" ]; then
            TAG_NAME="dev-${{ github.ref_name }}"
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_NAME=Development Build (${{ github.ref_name }})" >> $GITHUB_ENV
            
            # Force move the tag to the latest commit so GitHub generates the correct zip/tar
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f $TAG_NAME
            git push -f origin $TAG_NAME
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "RELEASE_NAME=Release ${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            target/ROOT.war
            ${{ env.DOCKER_IMAGE_ARCHIVE }}
          token: ${{ secrets.GITHUB_TOKEN }}


name: Maven Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required so we can manipulate and push tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -Dgit.branch=${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Architecture Docker Images
        run: |
          # Dynamically get repository name (e.g., psso-idp-proxy-server-java)
          REPO_NAME="${{ github.event.repository.name }}"
          # Sanitize branch/tag name for Docker tag (e.g., replace '/' with '-')
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')

          AMD64_ARCHIVE="${REPO_NAME}-${BRANCH_TAG}-amd64.tar"
          ARM64_ARCHIVE="${REPO_NAME}-${BRANCH_TAG}-arm64.tar"

          echo "=== Building linux/amd64 image ==="
          docker buildx build \
            --platform linux/amd64 \
            -t "${REPO_NAME}:${BRANCH_TAG}" \
            -t "${REPO_NAME}:${BRANCH_TAG}-amd64" \
            --output "type=docker,dest=${AMD64_ARCHIVE}" \
            .

          echo "=== Building linux/arm64 image ==="
          docker buildx build \
            --platform linux/arm64 \
            -t "${REPO_NAME}:${BRANCH_TAG}" \
            -t "${REPO_NAME}:${BRANCH_TAG}-arm64" \
            --output "type=docker,dest=${ARM64_ARCHIVE}" \
            .

          echo "=== Compressing archives ==="
          gzip -f "${AMD64_ARCHIVE}"
          gzip -f "${ARM64_ARCHIVE}"

      - name: Determine Release Configuration and Move Tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" == "branch" ]; then
            TAG_NAME="dev-${{ github.ref_name }}"
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_NAME=Development Build (${{ github.ref_name }})" >> $GITHUB_ENV
            
            # Force move the tag to the latest commit so GitHub generates the correct zip/tar
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f $TAG_NAME
            git push -f origin $TAG_NAME
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "RELEASE_NAME=Release ${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            target/ROOT.war
            *.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}


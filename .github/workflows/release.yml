name: Maven Build and Release

on:
  push:
    branches:
      - '**'    # Triggers on pushes to any branch
    tags:
      - 'v*'    # Triggers on pushes to tags starting with 'v' (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating and updating GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Update this to match your project's Java version (e.g., 11, 17, 21)
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        # Builds the WAR file. Skips tests to speed up the release build; remove -DskipTests if you want tests to run.
        run: mvn clean package -DskipTests

      - name: Determine Release Configuration
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" == "branch" ]; then
            # For branches: Create a continuous tag (e.g., dev-main) and mark as Pre-release
            echo "TAG_NAME=dev-${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_NAME=Development Build (${{ github.ref_name }})" >> $GITHUB_ENV
          else
            # For tags: Use the actual git tag and mark as a formal Release
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "RELEASE_NAME=Release ${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          allowUpdates: true        # Allows updating the existing release
          replacesArtifacts: true   # Deletes the old WAR and uploads the new one
          artifacts: "target/*.war" # Grabs the WAR generated by pom.xml
          token: ${{ secrets.GITHUB_TOKEN }}

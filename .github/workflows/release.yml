name: Build and Release WAR

on:
  push:
    branches:
      - '**'      # any branch push -> rolling dev release (draft/private)
    tags:
      - '*'       # any tag push -> permanent public release

permissions:
  contents: write   # required so the workflow can create/update releases and tags

jobs:
  # ---------------------------------------------------------------
  # DEVELOPMENT BUILDS: triggered by pushes to any branch.
  # Produces ONE rolling draft release per branch (private: visible
  # only to repo collaborators), always holding the latest WAR.
  # ---------------------------------------------------------------
  dev-build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.5
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.5

      - name: Build with Maven
        run: mvn clean package

      - name: Compute safe branch tag
        id: branchtag
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "tag_name=dev-${SAFE_BRANCH}-latest" >> "$GITHUB_OUTPUT"

      - name: Move rolling dev tag
        run: |
          git tag -f ${{ steps.branchtag.outputs.tag_name }}
          git push origin ${{ steps.branchtag.outputs.tag_name }} --force

      - name: Create/Update draft (private) dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.branchtag.outputs.tag_name }}
          name: "Dev build: ${{ github.ref_name }} (${{ github.sha }})"
          body: |
            Latest development build from branch `${{ github.ref_name }}`, commit ${{ github.sha }}.
            This is a draft release, visible only to repo collaborators.
          draft: true
          prerelease: true
          files: target/*.war
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # TAGGED BUILDS: triggered by pushing a git tag.
  # Produces ONE permanent, public, published release for that tag.
  # ---------------------------------------------------------------
  tagged-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven 3.9.5
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.5

      - name: Build with Maven
        run: mvn clean package

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: target/*.war
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
